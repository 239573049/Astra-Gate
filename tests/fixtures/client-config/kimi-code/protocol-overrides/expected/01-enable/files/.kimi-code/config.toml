# my kimi config
default_model = "astra-kimi-k2-5"

[providers.moonshot]
type = "kimi"
base_url = "https://api.moonshot.ai/v1"
api_key = "sk-moon"

[models.mine]
provider = "moonshot"
model = "kimi-k2"
max_context_size = 262144

[providers.astra]
type = "openai"
base_url = "https://astra.corp.com/v1"
api_key = "sk-astra-enterprise-key"

[models.astra-kimi-k2-5]
provider = "astra"
model = "kimi-k2.5"
max_context_size = 262144
capabilities = ["tool_use", "thinking", "image_in"]
protocol = "anthropic"
max_output_size = 32768
display_name = "Kimi K2.5"

[models.astra-gpt-5-1]
provider = "astra"
model = "gpt-5.1"
max_context_size = 400000
capabilities = ["tool_use", "thinking"]
protocol = "openai_responses"
max_output_size = 128000
display_name = "GPT 5.1"

[models.astra-claude-sonnet-4-5]
provider = "astra"
model = "claude-sonnet-4-5"
max_context_size = 200000
capabilities = ["tool_use", "image_in"]
max_output_size = 64000
display_name = "Claude Sonnet 4.5"

[models.astra-gemini-2-5-pro]
provider = "astra"
model = "gemini-2.5-pro"
max_context_size = 1048576
capabilities = ["tool_use", "thinking", "image_in"]
display_name = "Gemini 2.5 Pro"

[models.astra-plain]
provider = "astra"
model = "plain"
max_context_size = 131072
capabilities = ["tool_use"]
protocol = "openai_responses"
