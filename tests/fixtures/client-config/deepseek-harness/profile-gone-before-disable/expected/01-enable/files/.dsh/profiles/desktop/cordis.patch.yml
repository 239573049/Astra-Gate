# Harness profile patch
- id: "llm-pi-ai"
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      mine:
        displayName: "Mine"
        apiKeyEnv: "MY_KEY"
        api: "openai-completions"
        baseURL: "https://api.example.com/v1"
        models:
          - {"id":"m1","name":"M1"}
      astra:
        displayName: "Astra"
        apiKeyEnv: "ASTRA_GATEWAY_API_KEY"
        api: "openai-completions"
        baseURL: "https://astra.corp.com/v1"
        models:
          - {"id":"deepseek-chat","name":"DeepSeek Chat","contextWindow":128000,"maxTokens":8192}
- id: "agent-default-model"
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: "astra"
    model: "deepseek-chat"
- id: other-pkg
  name: "@deepseek-ai/other"
  config:
    flag: true
