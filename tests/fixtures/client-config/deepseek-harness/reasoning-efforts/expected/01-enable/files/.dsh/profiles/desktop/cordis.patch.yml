# Harness profile patch
- id: "llm-pi-ai"
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      mine:
        displayName: "Mine"
        apiKeyEnv: "MY_KEY"
        api: "openai-completions"
        baseURL: "https://api.example.com/v1"
        models:
          - {"id":"m1","name":"M1"}
      astra:
        displayName: "Astra"
        apiKeyEnv: "ASTRA_GATEWAY_API_KEY"
        api: "openai-completions"
        baseURL: "https://astra.corp.com/v1"
        models:
          - {"id":"deepseek-chat","name":"DeepSeek Chat","contextWindow":128000,"maxTokens":8192,"reasoningEfforts":{"low":"low","medium":"medium","high":"high"}}
          - {"id":"plain-chat","name":"Plain Chat"}
      astra-responses:
        displayName: "Astra (Responses)"
        apiKeyEnv: "ASTRA_GATEWAY_API_KEY"
        api: "openai-responses"
        baseURL: "https://astra.corp.com/v1"
        models:
          - {"id":"gpt-5","name":"GPT-5","contextWindow":400000,"maxTokens":128000,"input":["text","image"],"reasoningEfforts":{"low":"low","medium":"medium","high":"high"}}
      astra-anthropic:
        displayName: "Astra (Anthropic)"
        apiKeyEnv: "ASTRA_GATEWAY_API_KEY"
        api: "anthropic-messages"
        baseURL: "https://astra.corp.com"
        models:
          - {"id":"claude-sonnet-4-5","name":"Claude Sonnet 4.5","contextWindow":200000,"maxTokens":64000,"input":["text","image"],"reasoningEfforts":{"low":"low","medium":"medium","high":"high"}}
- id: "agent-default-model"
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: "astra"
    model: "deepseek-chat"
- id: other-pkg
  name: "@deepseek-ai/other"
  config:
    flag: true
