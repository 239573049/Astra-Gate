name: Release

on:
  push:
    tags: ['v*']
    # Bumping the version on main (node scripts/sync-versions.mjs --version
    # x.y.z rewrites cli/package.json) releases too, and tags v<version> when
    # done. Path filters only apply to the branch push, not to tags. Pushes
    # whose version is already on npm stop after the `version` job.
    branches: [main]
    paths: ['cli/package.json']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build only (skip npm publish and the update feed)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Publishing runs are serialized: a bump on main and a manual tag for the same
# version must not publish concurrently (the later run then sees the version
# on npm and skips). Build-only dispatches run independently.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-dispatch-{0}', github.run_id) || 'release-publish' }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: v
        run: |
          set -euo pipefail
          VER=$(node -p "require('./cli/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "workflow_dispatch: build only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $VER"
            exit 1
          fi
          # @aidotnet/astra-gate is published last, so its presence means this
          # version was released completely.
          if [ -n "$(npm view "@aidotnet/astra-gate@$VER" version 2>/dev/null)" ]; then
            echo "$VER is already on npm — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every release needs its notes: they become the GitHub Release body,
          # the download page notes and the update manifest's `notes`.
          if [ -z "$(node scripts/changelog-section.mjs "$VER")" ]; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section — add the release notes first."
            exit 1
          fi
          echo "Releasing $VER."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # macOS notarization waits in Apple's queue per artifact (dir + dmg + zip
    # per job); 60 min keeps the mac rows safe without slowing the others.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-14 }
          # macos-13 (the last Intel image) is retired; cross-build x64 on
          # Apple silicon — dotnet publish -r osx-x64 and electron-builder
          # --x64 both target Intel without running the binary.
          - { rid: osx-x64, os: macos-14 }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check macOS signing credentials
        # Fail before the (long) build when a secret is missing: unsigned mac
        # artifacts pass CI but break Gatekeeper and Squirrel.Mac's designated
        # requirement check on the user's machine — the most expensive failure.
        if: startsWith(matrix.rid, 'osx')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=''
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "macOS signing credentials present."

      - name: Install dependencies
        shell: bash
        # electron-builder's node-gyp step downloads Electron headers from
        # www.electronjs.org, which has a short connect timeout and fails
        # transiently — retry instead of burning a whole release run.
        run: |
          for attempt in 1 2 3; do
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile && exit 0
            else
              pnpm install && exit 0
            fi
            echo "::warning::pnpm install attempt ${attempt} failed, retrying"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build web UI
        if: hashFiles('web/package.json') != ''
        shell: bash
        run: pnpm --filter @aidotnet/web build

      - name: Publish server binary (self-contained, single file)
        shell: bash
        run: >-
          dotnet publish src/Astra.Server -c Release -r "$RID"
          --self-contained true -p:PublishSingleFile=true -o out/publish

      - name: Verify versions are in sync
        shell: bash
        run: node scripts/sync-versions.mjs --check

      - name: Hash the server binary into a manifest partial
        shell: bash
        run: >-
          node scripts/gen-manifest.mjs partial --rid "$RID"
          --binary "out/publish/astra-server${{ startsWith(matrix.rid, 'win') && '.exe' || '' }}"
          --out "out/feed/partial-$RID.json"

      - name: Pack server platform package
        shell: bash
        run: node scripts/pack-platform.mjs --rid "$RID" --publish-dir out/publish --web-dist web/dist

      - name: Stage the server for the desktop installers
        if: hashFiles('desktop/package.json') != ''
        shell: bash
        # electron-builder ships desktop/server-bundle as resources/server
        # (extraResources), so the standalone installers run without the CLI.
        run: |
          set -euo pipefail
          server_dir=$(node -e "import('./scripts/rid-map.mjs').then(m => console.log(m.ridToServerDir(process.argv[1])))" "$RID")
          rm -rf desktop/server-bundle
          cp -R "npm/$server_dir/bin" desktop/server-bundle
          ls -la desktop/server-bundle

      - name: Build desktop app
        if: hashFiles('desktop/package.json') != ''
        shell: bash
        # Every row builds the full target set from electron-builder.yml:
        # dir (npm platform package) + the standalone installers — signed and
        # notarized dmg + zip on mac, NSIS on Windows, AppImage on Linux.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(matrix.rid, 'osx') && 'true' || 'false' }}
          # Only mac rows get the certificate: a mac p12 must not reach the
          # Windows signing path.
          CSC_LINK: ${{ startsWith(matrix.rid, 'osx') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.rid, 'osx') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(matrix.rid, 'osx') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.rid, 'osx') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.rid, 'osx') && secrets.APPLE_TEAM_ID || '' }}
          # Baked into app-update.yml for every updatable target; only the mac
          # DMG track consumes it today. Defaults to the official site's feed.
          ASTRA_FEED_URL: ${{ secrets.ASTRA_FEED_URL || 'https://astra-gate.si/api/client-releases/stable' }}
        run: |
          set -euo pipefail
          pnpm --filter @aidotnet/desktop build
          ARCH=$([[ "$RID" == *-arm64 ]] && echo "--arm64" || echo "--x64")
          case "$RID" in
            osx-*) OS=--mac ;;
            win-*) OS=--win ;;
            *) OS=--linux ;;
          esac
          pnpm --filter @aidotnet/desktop exec electron-builder "$OS" "$ARCH" --publish never --config.directories.output=../out/desktop

      - name: Collect desktop app into platform package
        if: hashFiles('desktop/package.json') != ''
        shell: bash
        run: node scripts/pack-desktop.mjs --rid "$RID" --builder-dir out/desktop

      - name: npm pack platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pkg
          server_dir=$(node -e "import('./scripts/rid-map.mjs').then(m => console.log(m.ridToServerDir(process.argv[1])))" "$RID")
          (cd "npm/$server_dir" && npm pack --pack-destination ../../out/pkg)
          desktop_dir=$(node -e "import('./scripts/rid-map.mjs').then(m => console.log(m.ridToDesktopDir(process.argv[1])))" "$RID")
          if [ -d "npm/$desktop_dir/app" ] && [ -n "$(ls -A "npm/$desktop_dir/app" 2>/dev/null)" ]; then
            (cd "npm/$desktop_dir" && npm pack --pack-destination ../../out/pkg)
          else
            echo "No desktop app produced for $RID — skipping the desktop package."
          fi

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: out/pkg/*.tgz
          if-no-files-found: error

      - name: Upload feed inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/feed-upload
          cp out/feed/partial-*.json out/feed-upload/
          if [[ "$RID" == osx-* ]]; then
            cp out/desktop/*.dmg out/feed-upload/
            cp out/desktop/*.zip out/feed-upload/
            cp out/desktop/latest-mac.yml out/feed-upload/
          elif [[ "$RID" == win-* ]]; then
            cp out/desktop/Astra-*-setup.exe out/feed-upload/
          else
            cp out/desktop/Astra-*.AppImage out/feed-upload/
          fi
          ls -la out/feed-upload

      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.rid }}
          path: out/feed-upload/*
          if-no-files-found: error

  publish:
    name: Publish to npm and the update feed
    needs: [version, build]
    # Tag pushes and version bumps on main publish; workflow_dispatch runs are
    # build-only, and already-published versions were stopped by `version`.
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Creates the v<version> tag and GitHub Release.
      contents: write
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build CLI
        run: pnpm --filter astragate build

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: out/artifacts
          merge-multiple: true

      - name: Extract the release notes
        # The CHANGELOG.md section (checked to exist by the `version` job).
        run: |
          node scripts/changelog-section.mjs "$VER" --out out/release-notes.md
          cat out/release-notes.md

      - name: Assemble the update feed
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out/feed/stable
          partials=()
          for f in out/artifacts/partial-*.json; do
            partials+=(--partial "$f")
          done
          node scripts/gen-manifest.mjs merge \
            --version "$VER" \
            "${partials[@]}" \
            --notes-file out/release-notes.md \
            --out out/feed/stable/latest.json
          cp out/artifacts/*.dmg out/feed/stable/
          cp out/artifacts/*.zip out/feed/stable/
          cp out/artifacts/latest-mac.yml out/feed/stable/
          ls -la out/feed/stable

      - name: Publish to the update feed
        # `secrets` is not available in step-level `if` expressions —
        # evaluate the env copy instead.
        env:
          FEED_UPLOAD_TARGET: ${{ secrets.FEED_UPLOAD_TARGET }}
        if: env.FEED_UPLOAD_TARGET != ''
        run: node scripts/publish-feed.mjs --dir out/feed --dest "$FEED_UPLOAD_TARGET"

      - name: Upload desktop artifacts to the docs site
        # Primary desktop distribution: the official website stores the files
        # under /app/data/client-releases and serves the download page plus
        # the electron-updater feed from them. Requires the docs deployment
        # to run with CLIENT_UPLOAD_TOKEN set; the repo secret may use either
        # name. Missing secrets warn instead of silently skipping.
        env:
          DOCS_RELEASE_URL: ${{ secrets.DOCS_RELEASE_URL }}
          DOCS_RELEASE_TOKEN: ${{ secrets.DOCS_RELEASE_TOKEN || secrets.CLIENT_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "$DOCS_RELEASE_URL" ] || [ -z "$DOCS_RELEASE_TOKEN" ]; then
            echo "::warning::Not uploading to the docs site: set the DOCS_RELEASE_URL and DOCS_RELEASE_TOKEN (or CLIENT_UPLOAD_TOKEN) secrets."
            exit 0
          fi
          for f in out/artifacts/Astra-*.dmg out/artifacts/Astra-*.zip \
                   out/artifacts/Astra-*-setup.exe out/artifacts/Astra-*.AppImage; do
            # electron-builder names: Astra-<ver>-<arch>[-setup].<ext>, where
            # an AppImage spells x64 as x86_64.
            case "$f" in
              *.dmg) os=darwin kind=dmg ;;
              *.zip) os=darwin kind=zip ;;
              *.exe) os=win32 kind=exe ;;
              *.AppImage) os=linux kind=appimage ;;
            esac
            case "$f" in
              *arm64*) arch=arm64 ;;
              *x64*|*x86_64*) arch=x64 ;;
              *) echo "::warning::skip $f (unknown arch)"; continue ;;
            esac
            platform="$os-$arch"
            echo "Uploading $(basename "$f") ($platform/$kind)…"
            curl --fail --silent --show-error -X POST \
              "${DOCS_RELEASE_URL%/}/api/client-releases/upload" \
              -H "Authorization: Bearer ${DOCS_RELEASE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "x-astra-version: ${VER}" \
              -H "x-astra-platform: ${platform}" \
              -H "x-astra-kind: ${kind}" \
              --data-binary "@${f}"
            echo
          done
          # Server-update manifest (update-core / UpdateCheckService fetch
          # ${FEED}/<channel>/latest.json from the docs site). It also carries
          # the release notes shown on the download page.
          if [ -f out/feed/stable/latest.json ]; then
            echo "Uploading server-update manifest (latest.json)…"
            curl --fail --silent --show-error -X POST \
              "${DOCS_RELEASE_URL%/}/api/client-releases/upload" \
              -H "Authorization: Bearer ${DOCS_RELEASE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "x-astra-version: ${VER}" \
              -H "x-astra-platform: manifest" \
              -H "x-astra-kind: json" \
              -H "x-astra-notes-b64: $(base64 -w0 out/release-notes.md)" \
              --data-binary "@out/feed/stable/latest.json"
            echo
          fi

      - name: Publish platform packages first, then the CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Idempotent: a re-run after a partial failure skips what is already
          # on npm (npm refuses to republish a version).
          publish() {
            local id
            id=$(tar -xzOf "$1" package/package.json | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); j.name+'@'+j.version")
            if [ -n "$(npm view "$id" version 2>/dev/null)" ]; then
              echo "$id is already on npm — skipping."
            else
              npm publish "$1" --access public
            fi
          }
          # @aidotnet/server-* must exist before `astragate` / `@aidotnet/astra-gate`
          # resolve their optionalDependencies.
          # npm pack names a scoped tarball "aidotnet-server-...tgz" (no @ or +).
          for f in out/artifacts/aidotnet-server-*.tgz; do
            publish "$f"
          done
          for f in out/artifacts/aidotnet-desktop-*.tgz; do
            publish "$f"
          done
          npm pack ./cli --pack-destination out/artifacts
          for f in out/artifacts/astragate-[0-9]*.tgz; do
            publish "$f"
          done
          # Same CLI, also published as @aidotnet/astra-gate. Rebuild after the
          # rename: tsup inlines package.json, and the CLI's self-update uses
          # the baked-in name to update the package the user installed.
          node -e "const fs=require('fs');const p='cli/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='@aidotnet/astra-gate';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          pnpm --dir cli run build
          npm pack ./cli --pack-destination out/artifacts
          for f in out/artifacts/aidotnet-astra-gate-[0-9]*.tgz; do
            publish "$f"
          done

      - name: Create the GitHub Release
        # v<version> with the changelog notes and the installers attached. On
        # a version bump from main this also creates the tag (on this commit);
        # tags made with GITHUB_TOKEN do not start another run. Re-runs update
        # the existing release instead of failing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(out/artifacts/Astra-*.dmg out/artifacts/Astra-*.zip \
                  out/artifacts/Astra-*-setup.exe out/artifacts/Astra-*.AppImage)
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release edit "v$VER" --title "v$VER" --notes-file out/release-notes.md
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "v$VER" "${assets[@]}" --clobber
            fi
          else
            gh release create "v$VER" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "v$VER" --notes-file out/release-notes.md
          fi
